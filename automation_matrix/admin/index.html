<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Matrix — Admin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:#0d1117; color:#c9d1d9; padding:2rem; }
h1 { color:#58a6ff; margin-bottom:0.5rem; }
.sub { color:#8b949e; margin-bottom:2rem; }
.card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1.5rem; margin-bottom:1.5rem; }
.card h2 { font-size:1.1rem; color:#58a6ff; margin-bottom:1rem; }
table { width:100%; border-collapse:collapse; font-size:0.9rem; }
th, td { text-align:left; padding:0.6rem 0.5rem; border-bottom:1px solid #21262d; }
th { color:#8b949e; font-weight:600; text-transform:uppercase; font-size:0.75rem; }
.status-pending { color:#f0883e; }
.status-paid { color:#3fb950; }
.badge { display:inline-block; padding:0.15rem 0.5rem; border-radius:12px; font-size:0.75rem; font-weight:600; }
.badge-kaspa { background:#1f6feb22; color:#58a6ff; border:1px solid #1f6feb44; }
.badge-alephium { background:#8957e522; color:#a371f7; border:1px solid #8957e544; }
.copy-btn { cursor:pointer; font-size:0.75rem; color:#8b949e; margin-left:0.4rem; }
.copy-btn:hover { color:#58a6ff; }
.refresh { float:right; background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:0.4rem 1rem; border-radius:6px; cursor:pointer; }
.refresh:hover { background:#30363d; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; text-align:center; }
.stat-num { font-size:1.8rem; font-weight:700; color:#f0f6fc; }
.stat-label { font-size:0.75rem; color:#8b949e; text-transform:uppercase; }
</style>
</head>
<body>
<h1>Automation Matrix</h1>
<p class="sub">Panel de administración — Backend Heavy-Compute</p>
<button class="refresh" onclick="loadData()">↻ Recargar</button>
<div class="stats" id="stats"></div>
<div class="card">
  <h2>Clientes Registrados</h2>
  <table><thead><tr><th>ID</th><th>Nombre</th><th>Contacto</th><th>Servicio</th><th>Address Kaspa</th><th>Estado</th></tr></thead><tbody id="clientes-tbody"></tbody></table>
</div>
<div class="card">
  <h2>Servicios</h2>
  <table><thead><tr><th>Servicio</th><th>Puerto</th><th>Estado</th></tr></thead><tbody id="services-tbody"></tbody></table>
</div>
<script>
const API_KEY = localStorage.getItem('api_key') || prompt('API Key:');
localStorage.setItem('api_key', API_KEY);

async function api(url) {
  const r = await fetch(url, { headers: { 'x-api-key': API_KEY } });
  return r.json();
}

async function loadData() {
  try {
    const [clientes, health, status] = await Promise.all([
      api('/api/v1/clientes'),
      api('/health'),
      api('/api/v1/status'),
    ]);
    renderStats(clientes);
    renderClientes(clientes);
    renderServices(health);
  } catch(e) {
    document.getElementById('clientes-tbody').innerHTML = '<tr><td colspan="6" style="color:#f85149">Error conectando al backend</td></tr>';
  }
}

function renderStats(clientes) {
  const total = clientes.length;
  const pendientes = clientes.filter(c => c.estado === 'pendiente_pago').length;
  const pagados = clientes.filter(c => c.estado === 'pagado').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total Clientes</div></div>
    <div class="stat"><div class="stat-num" style="color:#f0883e">${pendientes}</div><div class="stat-label">Pendientes</div></div>
    <div class="stat"><div class="stat-num" style="color:#3fb950">${pagados}</div><div class="stat-label">Pagados</div></div>
  `;
}

function renderClientes(clientes) {
  const tbody = document.getElementById('clientes-tbody');
  if (!clientes.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:#8b949e">No hay clientes registrados</td></tr>';
    return;
  }
  tbody.innerHTML = clientes.map(c => `
    <tr>
      <td style="font-family:monospace;font-size:0.8rem">${c.id.slice(0,8)}</td>
      <td><strong>${c.nombre}</strong></td>
      <td>${c.email || '—'}<br><span style="font-size:0.75rem;color:#8b949e">${c.telefono || ''}</span></td>
      <td>${c.servicio}</td>
      <td style="font-family:monospace;font-size:0.75rem">
        <span class="badge badge-kaspa">KAS</span> ${c.address_kaspa.slice(0,30)}…<br>
        <span class="badge badge-alephium">ALPH</span> ${c.address_alephium.slice(0,30)}…
      </td>
      <td class="${c.estado === 'pagado' ? 'status-paid' : 'status-pending'}">${c.estado}</td>
    </tr>
  `).join('');
}

function renderServices(health) {
  document.getElementById('services-tbody').innerHTML = `
    <tr><td>Express API</td><td>8080 / 8443</td><td style="color:#3fb950">● activo</td></tr>
    <tr><td>Registrar</td><td>8081</td><td style="color:#3fb950">● activo</td></tr>
    <tr><td>Kaspa Wallet</td><td>8082</td><td style="color:#f0883e">● esperando nodo</td></tr>
    <tr><td>Nym Proxy</td><td>1080</td><td style="color:#f0883e">● esperando provider</td></tr>
  `;
}

loadData();
</script>
</body>
</html>
